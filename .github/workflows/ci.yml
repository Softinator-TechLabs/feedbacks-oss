name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run check
      - name: Native PostgreSQL transaction checks
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          export PATH="$(pg_config --bindir):$PATH"
          npm run test:postgres
      - run: npm audit --audit-level=high
      - run: npm run release:source
      - name: Dependency inventory
        run: npm sbom --sbom-format cyclonedx > dist/releases/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.node == 22
        with:
          name: feedbacks-release-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/releases/*.tar.gz
            dist/releases/*.sha256
            dist/releases/sbom.cdx.json
            dist/extension/*.zip
            dist/extension/*.sha256
            dist/feedbacks-codex-plugin.zip
            dist/feedbacks-codex-plugin.zip.sha256

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: docker build --tag feedbacks-app:check .
      - run: docker build --file Dockerfile.site --tag feedbacks-site:check .
      - run: npm run test:containers

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks binary
        run: |
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/feedbacks-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/feedbacks-gitleaks gitleaks
      - run: /tmp/feedbacks-gitleaks/gitleaks git --redact --no-banner --log-opts=--all
