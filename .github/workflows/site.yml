name: Deploy public site

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-public-site-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-public-site
      url: ${{ vars.CLOUDFLARE_SITE_URL }}
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Require successful exact-target main CI
        id: gate
        run: node scripts/verify-site-deploy.mjs
      - if: steps.gate.outputs.deploy == 'true'
        run: npm ci
      - name: Build website and docs with source receipt
        if: steps.gate.outputs.deploy == 'true'
        run: |
          npm run build:site
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync("dist/site/deployment.json", JSON.stringify({ sha: process.env.TARGET_SHA }) + "\n")'
      - name: Recheck main before deployment
        if: steps.gate.outputs.deploy == 'true'
        id: current
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$TARGET_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Main advanced during the build; leaving deployment to its CI run.'
          fi
      - name: Deploy static assets
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_SITE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_SITE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: npx --yes wrangler@4.151.3 deploy --config wrangler.site.jsonc --message "Website and docs from $TARGET_SHA"
      - name: Verify live source revision and public routes
        if: steps.current.outputs.deploy == 'true'
        env:
          SITE_URL: ${{ vars.CLOUDFLARE_SITE_URL }}
        run: |
          [[ "$SITE_URL" == https://* ]]
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --user-agent 'Feedbacks-deployment-verification/1.0' \
            "${SITE_URL%/}/deployment.json?sha=$TARGET_SHA" | jq --exit-status --arg sha "$TARGET_SHA" '.sha == $sha'
          for path in / /docs/ /docs/guide/getting-started.md /healthz; do
            curl --fail --silent --show-error --output /dev/null \
              --user-agent 'Feedbacks-deployment-verification/1.0' "${SITE_URL%/}$path"
          done
          echo "Verified live website and docs from $TARGET_SHA" >> "$GITHUB_STEP_SUMMARY"
