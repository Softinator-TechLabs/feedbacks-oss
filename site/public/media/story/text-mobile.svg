<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-labelledby="title"><title id="title">An exact original phrase and its suggested replacement</title><style>text{font-family:Arial,sans-serif;fill:#20241e}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#596054}</style><rect width="400" height="320" rx="10" fill="#edf2e5"/><text x="24" y="42" class="label">Suggest the exact words.</text><text x="24" y="88" class="small">Original</text><text x="24" y="123" font-size="23">A chair for <tspan fill="#8b321b" text-decoration="line-through">every room</tspan>.</text><path d="M36 143v31h24m-7-6 7 6-7 6" fill="none" stroke="#87917e" stroke-width="2"/><text x="78" y="179" font-size="21" font-weight="700">your favourite corner</text><text x="24" y="234" class="small">Original + replacement + screenshot</text><text x="24" y="270" class="small">Illustrative suggestion.</text><text x="24" y="294" class="small">The live page stays unchanged.</text></svg>