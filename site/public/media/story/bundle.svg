<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title"><title id="title">A complete thread bundle keeps conversation, media and diagnostic files together</title><style>text{font-family:Arial,sans-serif;fill:#20241e}.small{font-size:15px;fill:#596054}.label{font-size:18px;font-weight:700}.line{fill:none;stroke:#87917e;stroke-width:2}.code{font-family:monospace;font-size:15px}</style><rect width="760" height="320" rx="12" fill="#f6ece6"/><text x="36" y="46" class="label">The evidence travels with the issue.</text><path d="M43 105h66l16 16h114v115H43Z" fill="#fff" stroke="#bca79e" stroke-width="2"/><text x="62" y="159" class="label">Thread bundle</text><text x="62" y="187" class="code">.tar.gz</text><path class="line" d="M256 175h54m-8-6 8 6-8 6M327 97v156M327 97h30M327 149h30M327 201h30M327 253h30"/><text x="375" y="104" class="label">Conversation + page context</text><text x="375" y="156" class="label">Screenshots + video</text><text x="375" y="208" class="label">Recordings + diagnostics</text><text x="375" y="260" class="label">Manifest + checksums</text><text x="36" y="290" class="small">Download once. Investigate with your own tools.</text></svg>