<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title"><title id="title">One timeline connects a click, failed request and console error</title><style>text{font-family:Arial,sans-serif;fill:#20241e}.small{font-size:15px;fill:#596054}.label{font-size:18px;font-weight:700}.line{fill:none;stroke:#87917e;stroke-width:2}.code{font-family:monospace;font-size:15px}</style><rect width="760" height="320" rx="12" fill="#edf0f9"/><text x="36" y="46" class="label">One moment. The whole story.</text><text x="36" y="75" class="small">Illustrative recording · select an event to inspect that moment</text><path d="M72 143H686" stroke="#aeb8cf" stroke-width="4"/><circle cx="94" cy="143" r="8" fill="#456a94"/><circle cx="378" cy="143" r="8" fill="#a43e17"/><circle cx="656" cy="143" r="8" fill="#a43e17"/><path d="M378 113v59" stroke="#a43e17" stroke-width="2"/><text x="64" y="112" class="small">00:02</text><text x="348" y="103" class="small">00:04</text><text x="626" y="112" class="small">00:05</text><text x="48" y="201" class="label">Click</text><text x="292" y="201" class="label">Request fails</text><text x="566" y="201" class="label">Console error</text><text x="48" y="228" class="small">Place order</text><text x="292" y="228" class="small">POST /checkout · 500</text><text x="566" y="228" class="small">Checkout failed</text><text x="36" y="286" class="small">Video / DOM replay + activity + console + network + performance</text></svg>