<svg xmlns="http://www.w3.org/2000/svg" width="400" height="360" viewBox="0 0 400 360" role="img" aria-labelledby="title"><title id="title">Your queue, evidence and approved guidance help Codex or Claude suggest a task for you to choose</title><style>text{font-family:Arial,sans-serif;fill:#20241e}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#596054}</style><rect width="400" height="360" rx="10" fill="#f3f4ef"/><text x="24" y="38" class="label">Find the work that needs you.</text><rect x="24" y="56" width="352" height="57" rx="4" fill="#fff"/><text x="40" y="80" class="label">Your queue</text><text x="40" y="102" class="small">Assigned to you · Top priority · Dates</text><rect x="24" y="123" width="352" height="57" rx="4" fill="#fff"/><text x="40" y="147" class="label">The evidence</text><text x="40" y="169" class="small">Notes · screenshots · diagnostics</text><rect x="24" y="190" width="352" height="57" rx="4" fill="#fff"/><text x="40" y="214" class="label">Approved guidance</text><text x="40" y="236" class="small">Instructions · responsibilities</text><path d="M200 253v19m-6-7 6 7 6-7" fill="none" stroke="#87917e" stroke-width="2"/><rect x="24" y="282" width="352" height="61" rx="4" fill="#e4efc3"/><text x="40" y="307" class="label">Codex or Claude suggests a task.</text><text x="40" y="331" class="small">You choose the work. Your agent acts.</text></svg>