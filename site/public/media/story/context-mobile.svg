<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-labelledby="title"><title id="title">Evidence and approved guidance stay separate for your agent</title><style>text{font-family:Arial,sans-serif;fill:#20241e}.label{font-size:18px;font-weight:700}.small{font-size:15px;fill:#596054}</style><rect width="400" height="320" rx="10" fill="#f3f4ef"/><text x="24" y="42" class="label">Give your agent the context.</text><rect x="24" y="66" width="352" height="64" rx="4" fill="#fff"/><text x="40" y="93" class="label">What happened</text><text x="40" y="116" class="small">Notes · media · timeline · diagnostics</text><rect x="24" y="143" width="352" height="64" rx="4" fill="#fff"/><text x="40" y="170" class="label">How your team works</text><text x="40" y="193" class="small">Approved instructions · responsibilities</text><path d="M200 216v19m-6-7 6 7 6-7" fill="none" stroke="#87917e" stroke-width="2"/><rect x="24" y="248" width="352" height="58" rx="4" fill="#e4efc3"/><text x="40" y="274" class="label">Your developer + agent</text><text x="40" y="296" class="small">Read → implement → verify</text></svg>